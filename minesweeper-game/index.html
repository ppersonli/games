<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
body{display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',system-ui,sans-serif;color:#e0e0e0}
canvas{display:block;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// MINESWEEPER — Pure HTML5 Canvas
// Grid-based mine placement, reveal, flag, timer, difficulty
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const CELL = 32;
const PAD = 2;
const HUD_H = 50;
const DIFFICULTIES = {
  beginner:     { cols: 9,  rows: 9,  mines: 10, name: "Beginner" },
  intermediate: { cols: 16, rows: 16, mines: 40, name: "Intermediate" },
  expert:       { cols: 30, rows: 16, mines: 99, name: "Expert" },
};

let diff = "beginner";
let board = [];
let revealed = [];
let flagged = [];
let cols, rows, mineCount;
let gameState = "menu"; // menu, playing, won, lost
let firstClick = true;
let timer = 0;
let timerInterval = null;
let minesLeft = 0;
let revealCount = 0;
let totalSafe = 0;
let cellW, cellH;
let boardX, boardY;
let hoverCell = null;
let highScores = {};
try { highScores = JSON.parse(localStorage.getItem("ms_scores") || "{}"); } catch { highScores = {}; }

function resize() {
  const diff_ = DIFFICULTIES[diff];
  cellW = diff_.cols * CELL;
  cellH = diff_.rows * CELL;
  const W = Math.max(cellW + 40, 320);
  const H = cellH + HUD_H + 60;
  const ratio = W / H;
  let w = window.innerWidth, hh = window.innerHeight;
  if (w / hh > ratio) w = hh * ratio; else hh = w / ratio;
  canvas.style.width = w + "px";
  canvas.style.height = hh + "px";
  canvas.width = W;
  canvas.height = H;
  boardX = (W - cellW) / 2;
  boardY = HUD_H + 10;
}

// ── AUDIO ────────────────────────────────────────────────────

let ac;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); }
function tone(f, d, v, t, ramp) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t || "square"; o.connect(g); g.connect(ac.destination);
  o.frequency.setValueAtTime(f, ac.currentTime);
  if (ramp) o.frequency.exponentialRampToValueAtTime(ramp, ac.currentTime + d);
  g.gain.setValueAtTime(v || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
  o.start(); o.stop(ac.currentTime + d);
}
function sfxReveal() { tone(500, 0.05, 0.04, "sine"); }
function sfxFlag()   { tone(300, 0.08, 0.05); }
function sfxExplode(){ tone(150, 0.5, 0.12, "sawtooth", 30); }
function sfxWin()    { [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f, 0.15, 0.06, "sine"), i*100)); }

// ── NUMBER COLORS ────────────────────────────────────────────

const NUM_COLORS = [
  null,    // 0
  "#4a9eff", // 1 - blue
  "#51cf66", // 2 - green
  "#ff4444", // 3 - red
  "#9b59b6", // 4 - purple
  "#e67e22", // 5 - orange
  "#00bcd4", // 6 - cyan
  "#2c3e50", // 7 - dark
  "#95a5a6", // 8 - gray
];

// ── BOARD INIT ───────────────────────────────────────────────

function initBoard() {
  const d = DIFFICULTIES[diff];
  cols = d.cols; rows = d.rows; mineCount = d.mines;
  board = []; revealed = []; flagged = [];
  for (let r = 0; r < rows; r++) {
    board[r] = []; revealed[r] = []; flagged[r] = [];
    for (let c = 0; c < cols; c++) {
      board[r][c] = 0; revealed[r][c] = false; flagged[r][c] = false;
    }
  }
  firstClick = true;
  timer = 0;
  minesLeft = mineCount;
  revealCount = 0;
  totalSafe = cols * rows - mineCount;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  gameState = "playing";
  resize();
}

function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < mineCount) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (board[r][c] === -1) continue;
    if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
    board[r][c] = -1;
    placed++;
  }
  // Calculate numbers
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === -1) continue;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) count++;
        }
      }
      board[r][c] = count;
    }
  }
}

// ── GAME LOGIC ───────────────────────────────────────────────

function reveal(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (revealed[r][c] || flagged[r][c]) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    timerInterval = setInterval(() => { if (gameState === "playing") timer++; }, 1000);
  }

  revealed[r][c] = true;
  revealCount++;
  sfxReveal();

  if (board[r][c] === -1) {
    // Hit mine
    gameState = "lost";
    clearInterval(timerInterval);
    sfxExplode();
    // Reveal all mines
    for (let rr = 0; rr < rows; rr++)
      for (let cc = 0; cc < cols; cc++)
        if (board[rr][cc] === -1) revealed[rr][cc] = true;
    return;
  }

  // Flood fill if empty
  if (board[r][c] === 0) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        reveal(r + dr, c + dc);
      }
    }
  }

  // Win check
  if (revealCount === totalSafe) {
    gameState = "won";
    clearInterval(timerInterval);
    sfxWin();
    // Flag remaining mines
    for (let rr = 0; rr < rows; rr++)
      for (let cc = 0; cc < cols; cc++)
        if (board[rr][cc] === -1) flagged[rr][cc] = true;
    minesLeft = 0;
    // Save score
    const key = diff;
    if (!highScores[key] || timer < highScores[key]) {
      highScores[key] = timer;
      try { localStorage.setItem("ms_scores", JSON.stringify(highScores)); } catch {}
    }
  }
}

function chordReveal(r, c) {
  if (!revealed[r][c] || board[r][c] <= 0) return;
  let flagCount = 0;
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && flagged[nr][nc]) flagCount++;
    }
  if (flagCount === board[r][c]) {
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !flagged[nr][nc]) reveal(nr, nc);
      }
  }
}

// ── DRAW ─────────────────────────────────────────────────────

function drawCell(x, y, w, h, state, value, isHover, isLostMine) {
  const r = { x, y, w, h };

  if (state === "hidden") {
    // Unrevealed
    ctx.fillStyle = isHover ? "#3a3a5e" : "#2d2d4a";
    ctx.fillRect(x, y, w, h);
    // 3D effect
    ctx.fillStyle = "#404068";
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillStyle = "#1a1a30";
    ctx.fillRect(x + w - 2, y, 2, h);
    ctx.fillRect(x, y + h - 2, w, 2);
  } else if (state === "flagged") {
    ctx.fillStyle = "#2d2d4a";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#404068";
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillStyle = "#1a1a30";
    ctx.fillRect(x + w - 2, y, 2, h);
    ctx.fillRect(x, y + h - 2, w, 2);
    // Flag
    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🚩", x + w / 2, y + h / 2 + 1);
  } else {
    // Revealed
    ctx.fillStyle = isLostMine ? "#6b2020" : "#1e1e36";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#252540";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);

    if (value === -1) {
      // Mine
      ctx.fillStyle = isLostMine ? "#ff2222" : "#ff4444";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("💣", x + w / 2, y + h / 2 + 1);
    } else if (value > 0) {
      ctx.fillStyle = NUM_COLORS[value] || "#fff";
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(value), x + w / 2, y + h / 2 + 1);
    }
  }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, 0, W, H);

  if (gameState === "menu") {
    drawMenu();
    return;
  }

  // HUD
  drawHUD();

  // Board background
  ctx.fillStyle = "#14142a";
  ctx.fillRect(boardX - 4, boardY - 4, cellW + 8, cellH + 8);
  ctx.strokeStyle = "#333366";
  ctx.lineWidth = 2;
  ctx.strokeRect(boardX - 4, boardY - 4, cellW + 8, cellH + 8);

  // Cells
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = boardX + c * CELL + PAD;
      const y = boardY + r * CELL + PAD;
      const sz = CELL - PAD * 2;
      const isHover = hoverCell && hoverCell.r === r && hoverCell.c === c && !revealed[r][c] && gameState === "playing";
      const isLostMine = gameState === "lost" && board[r][c] === -1 && revealed[r][c];

      let state = "hidden";
      if (revealed[r][c]) state = "revealed";
      else if (flagged[r][c]) state = "flagged";

      drawCell(x, y, sz, sz, state, board[r][c], isHover, isLostMine);
    }
  }

  // Game over overlay
  if (gameState === "won" || gameState === "lost") {
    drawGameOver();
  }
}

function drawHUD() {
  const W = canvas.width;

  // Left: mine counter
  ctx.fillStyle = "#0a0a18";
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.strokeStyle = "#333366";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke();

  ctx.fillStyle = "#ff4444";
  ctx.font = "bold 22px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText("💣 " + String(minesLeft).padStart(3, "0"), 15, 32);

  // Center: timer
  ctx.fillStyle = "#4a9eff";
  ctx.font = "bold 22px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.fillText("⏱ " + String(timer).padStart(3, "0"), W / 2, 32);

  // Right: difficulty
  ctx.fillStyle = "#8888aa";
  ctx.font = "13px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(DIFFICULTIES[diff].name, W - 15, 20);

  // Right: best time
  const best = highScores[diff];
  if (best !== undefined) {
    ctx.fillStyle = "#ffd43b";
    ctx.font = "12px sans-serif";
    ctx.fillText("Best: " + best + "s", W - 15, 38);
  }
}

function drawMenu() {
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = "#4a9eff";
  ctx.font = "bold 42px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.fillText("MINESWEEPER", W / 2, 80);

  ctx.fillStyle = "#8888aa";
  ctx.font = "15px sans-serif";
  ctx.fillText("Select difficulty to start", W / 2, 115);

  const diffs = ["beginner", "intermediate", "expert"];
  let y = 170;
  for (const d of diffs) {
    const def = DIFFICULTIES[d];
    const isHover = hoverCell && hoverCell.type === d;
    const isSelected = d === diff;

    ctx.fillStyle = isHover ? "#2a2a50" : isSelected ? "#222248" : "#1e1e3a";
    ctx.fillRect(W / 2 - 140, y, 280, 65);
    ctx.strokeStyle = isSelected ? "#4a9eff" : "#333366";
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.strokeRect(W / 2 - 140, y, 280, 65);

    ctx.fillStyle = isSelected ? "#4a9eff" : "#ccccdd";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(def.name, W / 2, y + 25);

    ctx.fillStyle = "#8888aa";
    ctx.font = "13px sans-serif";
    ctx.fillText(def.cols + "×" + def.rows + "  " + def.mines + " mines", W / 2, y + 45);

    const best = highScores[d];
    if (best !== undefined) {
      ctx.fillStyle = "#ffd43b";
      ctx.font = "11px sans-serif";
      ctx.fillText("Best: " + best + "s", W / 2 + 90, y + 25);
    }

    y += 80;
  }

  // Controls
  ctx.fillStyle = "#666688";
  ctx.font = "13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Left click: Reveal  |  Right click: Flag  |  Click number: Chord", W / 2, y + 30);

  ctx.fillStyle = "#444466";
  ctx.font = "11px sans-serif";
  ctx.fillText("Reveal all safe cells to win. Don't hit a mine!", W / 2, y + 55);

  ctx.fillStyle = "#333344";
  ctx.font = "10px sans-serif";
  ctx.fillText("Pixiaoli Games | tools.pixiaoli.cn", W / 2, H - 15);
}

function drawGameOver() {
  const W = canvas.width, H = canvas.height;
  const midY = boardY + cellH / 2;

  ctx.fillStyle = "rgba(10,10,20,0.7)";
  ctx.fillRect(boardX, midY - 40, cellW, 80);

  ctx.textAlign = "center";
  if (gameState === "won") {
    ctx.fillStyle = "#51cf66";
    ctx.font = "bold 28px 'Courier New', monospace";
    ctx.fillText("YOU WIN!", boardX + cellW / 2, midY - 8);
    ctx.fillStyle = "#ffd43b";
    ctx.font = "14px sans-serif";
    ctx.fillText("Time: " + timer + "s", boardX + cellW / 2, midY + 15);
  } else {
    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 28px 'Courier New', monospace";
    ctx.fillText("GAME OVER", boardX + cellW / 2, midY - 8);
  }

  ctx.fillStyle = "#8888aa";
  ctx.font = "13px sans-serif";
  ctx.fillText("Click to restart", boardX + cellW / 2, midY + 32);
}

// ── INPUT ────────────────────────────────────────────────────

function screenToCell(sx, sy) {
  const c = Math.floor((sx - boardX) / CELL);
  const r = Math.floor((sy - boardY) / CELL);
  if (r >= 0 && r < rows && c >= 0 && c < cols) return { r, c };
  return null;
}

canvas.addEventListener("pointerdown", e => {
  audio();
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * canvas.width;
  const sy = (e.clientY - rect.top) / rect.height * canvas.height;

  if (gameState === "menu") {
    // Check difficulty buttons
    const diffs = ["beginner", "intermediate", "expert"];
    const W = canvas.width;
    let y = 170;
    for (const d of diffs) {
      if (sx >= W / 2 - 140 && sx <= W / 2 + 140 && sy >= y && sy <= y + 65) {
        diff = d;
        initBoard();
        return;
      }
      y += 80;
    }
    return;
  }

  if (gameState === "won" || gameState === "lost") {
    gameState = "menu";
    resize();
    return;
  }

  // Right click = flag
  if (e.button === 2) {
    const cell = screenToCell(sx, sy);
    if (cell && !revealed[cell.r][cell.c]) {
      flagged[cell.r][cell.c] = !flagged[cell.r][cell.c];
      minesLeft += flagged[cell.r][cell.c] ? -1 : 1;
      sfxFlag();
    }
    return;
  }

  // Left click
  const cell = screenToCell(sx, sy);
  if (!cell) return;

  if (revealed[cell.r][cell.c]) {
    chordReveal(cell.r, cell.c);
  } else if (!flagged[cell.r][cell.c]) {
    reveal(cell.r, cell.c);
  }
});

canvas.addEventListener("pointermove", e => {
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * canvas.width;
  const sy = (e.clientY - rect.top) / rect.height * canvas.height;

  if (gameState === "playing") {
    hoverCell = screenToCell(sx, sy);
  } else if (gameState === "menu") {
    const W = canvas.width;
    const diffs = ["beginner", "intermediate", "expert"];
    let y = 170;
    hoverCell = null;
    for (const d of diffs) {
      if (sx >= W / 2 - 140 && sx <= W / 2 + 140 && sy >= y && sy <= y + 65) {
        hoverCell = { type: d };
        break;
      }
      y += 80;
    }
  }
});

canvas.addEventListener("contextmenu", e => e.preventDefault());

// ── MAIN LOOP ────────────────────────────────────────────────

function loop() {
  draw();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
