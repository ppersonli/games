<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace}
canvas{display:block;touch-action:none;cursor:crosshair}
#ui{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#0ff;font-size:14px;text-align:center;pointer-events:none;text-shadow:0 0 8px #0ff}
</style>
</head>
<body>
<div id="ui"></div>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// SPACE SHOOTER — Pure HTML5 Canvas
// Player ship, enemy waves, bullets, score, sound effects
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// Responsive sizing
function resize() {
  const ratio = 480 / 720;
  let w = window.innerWidth, h = window.innerHeight;
  if (w / h > ratio) w = h * ratio; else h = w / ratio;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = 480;
  canvas.height = 720;
}
resize();
window.addEventListener("resize", resize);

const W = 480, H = 720, CX = W / 2;

// ── AUDIO ENGINE (Web Audio API) ─────────────────────────────

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playSound(type) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;

  switch (type) {
    case "shoot":
      osc.type = "square";
      osc.frequency.setValueAtTime(800, t);
      osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t); osc.stop(t + 0.1);
      break;
    case "enemy_shoot":
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(300, t);
      osc.frequency.exponentialRampToValueAtTime(100, t + 0.15);
      gain.gain.setValueAtTime(0.04, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.start(t); osc.stop(t + 0.15);
      break;
    case "hit":
      osc.type = "square";
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.start(t); osc.stop(t + 0.15);
      break;
    case "explode":
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(20, t + 0.4);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.start(t); osc.stop(t + 0.4);
      // Noise burst
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
      const noise = audioCtx.createBufferSource();
      const ng = audioCtx.createGain();
      noise.buffer = buf; noise.connect(ng); ng.connect(audioCtx.destination);
      ng.gain.setValueAtTime(0.1, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      noise.start(t); noise.stop(t + 0.3);
      break;
    case "powerup":
      osc.type = "sine";
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.exponentialRampToValueAtTime(1200, t + 0.2);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.3);
      break;
    case "die":
      osc.type = "square";
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.8);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      osc.start(t); osc.stop(t + 0.8);
      break;
    case "boss":
      osc.type = "triangle";
      osc.frequency.setValueAtTime(100, t);
      osc.frequency.setValueAtTime(120, t + 0.1);
      osc.frequency.setValueAtTime(80, t + 0.2);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.start(t); osc.stop(t + 0.4);
      break;
  }
}

// ── STARS BACKGROUND ─────────────────────────────────────────

const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    speed: 0.3 + Math.random() * 1.5,
    size: 0.5 + Math.random() * 1.5,
    alpha: 0.3 + Math.random() * 0.7,
  });
}

function updateStars(dt) {
  for (const s of stars) {
    s.y += s.speed * 60 * dt;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function drawStars() {
  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = "#fff";
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;
}

// ── PARTICLES ────────────────────────────────────────────────

const particles = [];

function spawnParticles(x, y, count, color, speed, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.5 + Math.random());
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: life * (0.5 + Math.random() * 0.5),
      maxLife: life,
      size: 1 + Math.random() * 3,
      color,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ── PLAYER ───────────────────────────────────────────────────

const player = {
  x: CX, y: H - 80, w: 32, h: 36, speed: 300,
  lives: 3, score: 0, combo: 0, comboTimer: 0,
  fireRate: 150, fireCD: 0,
  invincible: 0,
  power: 0, powerTimer: 0,
  weaponLevel: 0,
};

function drawPlayer() {
  const p = player;
  if (p.invincible > 0 && Math.floor(p.invincible * 10) % 2) return;

  ctx.save();
  ctx.translate(p.x, p.y);

  // Ship body
  ctx.fillStyle = p.power > 0 ? "#0ff" : "#4af";
  ctx.shadowColor = p.power > 0 ? "#0ff" : "#4af";
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, -p.h / 2);
  ctx.lineTo(-p.w / 2, p.h / 2);
  ctx.lineTo(-p.w / 4, p.h / 3);
  ctx.lineTo(0, p.h / 2.5);
  ctx.lineTo(p.w / 4, p.h / 3);
  ctx.lineTo(p.w / 2, p.h / 2);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = p.power > 0 ? "#aff" : "#8cf";
  ctx.beginPath();
  ctx.arc(0, -2, 5, 0, Math.PI * 2);
  ctx.fill();

  // Engine glow
  ctx.fillStyle = "#f80";
  ctx.shadowColor = "#f80";
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(-6, p.h / 3);
  ctx.lineTo(0, p.h / 2 + 8 + Math.random() * 8);
  ctx.lineTo(6, p.h / 3);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
  ctx.shadowBlur = 0;
}

// ── BULLETS ──────────────────────────────────────────────────

const playerBullets = [];
const enemyBullets = [];

function shootPlayer() {
  const p = player;
  const dmg = p.weaponLevel >= 2 ? 2 : 1;
  playerBullets.push({ x: p.x, y: p.y - p.h / 2, w: 3, h: 12, speed: 600, dmg });

  if (p.weaponLevel >= 1) {
    playerBullets.push({ x: p.x - 12, y: p.y - p.h / 4, w: 2, h: 8, speed: 550, dmg });
    playerBullets.push({ x: p.x + 12, y: p.y - p.h / 4, w: 2, h: 8, speed: 550, dmg });
  }
  if (p.weaponLevel >= 3) {
    playerBullets.push({ x: p.x - 20, y: p.y, w: 2, h: 8, speed: 500, dmg, angle: -0.15 });
    playerBullets.push({ x: p.x + 20, y: p.y, w: 2, h: 8, speed: 500, dmg, angle: 0.15 });
  }

  playSound("shoot");
}

function shootEnemy(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  enemyBullets.push({
    x: e.x, y: e.y + e.h / 2,
    w: 4, h: 8, speed: 200 + e.tier * 30,
    vx: (dx / dist) * 150, vy: (dy / dist) * 200 + 100,
  });
  playSound("enemy_shoot");
}

function updateBullets(dt) {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= b.speed * dt;
    if (b.angle) b.x += Math.sin(b.angle) * b.speed * dt;
    if (b.y < -20) playerBullets.splice(i, 1);
  }
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += (b.vx || 0) * dt;
    b.y += b.vy * dt;
    if (b.y > H + 20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
  }
}

function drawBullets() {
  ctx.shadowBlur = 6;
  for (const b of playerBullets) {
    ctx.fillStyle = "#0ff";
    ctx.shadowColor = "#0ff";
    ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
  }
  for (const b of enemyBullets) {
    ctx.fillStyle = "#f44";
    ctx.shadowColor = "#f44";
    ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
  }
  ctx.shadowBlur = 0;
}

// ── ENEMIES ──────────────────────────────────────────────────

const enemies = [];
let waveNum = 0, waveTimer = 0, waveDelay = 3;
let bossActive = false;

const ENEMY_TYPES = [
  { tier: 0, w: 24, h: 24, hp: 1, speed: 80,  score: 10,  color: "#f55", fireRate: 0 },
  { tier: 1, w: 28, h: 28, hp: 2, speed: 70,  score: 25,  color: "#fa0", fireRate: 3 },
  { tier: 2, w: 32, h: 32, hp: 4, speed: 55,  score: 50,  color: "#a0f", fireRate: 2 },
  { tier: 3, w: 36, h: 36, hp: 8, speed: 40,  score: 100, color: "#ff0", fireRate: 1.5 },
];

function spawnWave() {
  waveNum++;
  const isBoss = waveNum % 5 === 0;

  if (isBoss) {
    bossActive = true;
    playSound("boss");
    const hp = 20 + waveNum * 5;
    enemies.push({
      x: CX, y: -60, w: 60, h: 50, hp, maxHP: hp,
      tier: 4, speed: 30, score: 500 + waveNum * 50,
      color: "#f0f", fireRate: 0.8, fireCD: 0,
      movePattern: "boss", moveT: 0, isBoss: true,
    });
  } else {
    const count = Math.min(3 + Math.floor(waveNum / 2), 8);
    const maxTier = Math.min(ENEMY_TYPES.length - 1, Math.floor(waveNum / 3));
    for (let i = 0; i < count; i++) {
      const tier = Math.floor(Math.random() * (maxTier + 1));
      const type = ENEMY_TYPES[tier];
      enemies.push({
        x: 40 + (W - 80) * (i / (count - 1 || 1)),
        y: -40 - i * 30,
        w: type.w, h: type.h, hp: type.hp, maxHP: type.hp,
        tier: type.tier, speed: type.speed + waveNum * 2,
        score: type.score, color: type.color,
        fireRate: type.fireRate, fireCD: Math.random() * 2,
        movePattern: "zigzag", moveT: Math.random() * 10,
      });
    }
  }
}

function updateEnemies(dt) {
  waveTimer -= dt;
  if (waveTimer <= 0 && enemies.length === 0) {
    waveTimer = waveDelay;
    spawnWave();
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.moveT += dt;

    if (e.movePattern === "boss") {
      e.y += (120 - e.y) * 2 * dt;
      e.x = CX + Math.sin(e.moveT * 0.8) * 140;
    } else {
      e.y += e.speed * dt;
      if (e.tier >= 2) e.x += Math.sin(e.moveT * 2) * 80 * dt;
    }

    // Fire
    if (e.fireRate > 0) {
      e.fireCD -= dt;
      if (e.fireCD <= 0 && e.y > 0 && e.y < H - 100) {
        e.fireCD = e.fireRate;
        shootEnemy(e);
      }
    }

    // Off screen
    if (e.y > H + 60) { enemies.splice(i, 1); continue; }

    // Hit player
    if (player.invincible <= 0 && rectCollide(player, e)) {
      damagePlayer();
      if (!e.isBoss) { enemies.splice(i, 1); }
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);

    // Body
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 8;

    if (e.isBoss) {
      // Boss: large hexagonal shape
      ctx.beginPath();
      for (let a = 0; a < 6; a++) {
        const angle = (a / 6) * Math.PI * 2 - Math.PI / 2;
        const r = e.w / 2;
        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
      }
      ctx.closePath();
      ctx.fill();

      // Boss HP bar
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#333";
      ctx.fillRect(-30, -e.h / 2 - 12, 60, 6);
      ctx.fillStyle = "#f0f";
      ctx.fillRect(-30, -e.h / 2 - 12, 60 * (e.hp / e.maxHP), 6);
    } else {
      // Regular: diamond shape
      ctx.beginPath();
      ctx.moveTo(0, -e.h / 2);
      ctx.lineTo(e.w / 2, 0);
      ctx.lineTo(0, e.h / 2);
      ctx.lineTo(-e.w / 2, 0);
      ctx.closePath();
      ctx.fill();

      // Eyes
      ctx.fillStyle = "#fff";
      ctx.shadowBlur = 0;
      ctx.fillRect(-5, -4, 3, 3);
      ctx.fillRect(3, -4, 3, 3);
    }

    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

// ── POWER-UPS ────────────────────────────────────────────────

const powerups = [];
const PU_TYPES = ["weapon", "heal", "shield"];

function spawnPowerup(x, y) {
  const type = PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)];
  powerups.push({ x, y, w: 20, h: 20, type, vy: 80, life: 8 });
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.y > H + 20 || p.life <= 0) { powerups.splice(i, 1); continue; }

    if (rectCollide(player, p)) {
      playSound("powerup");
      if (p.type === "weapon") player.weaponLevel = Math.min(3, player.weaponLevel + 1);
      else if (p.type === "heal") player.lives = Math.min(5, player.lives + 1);
      else if (p.type === "shield") { player.invincible = 3; player.power = 3; }
      powerups.splice(i, 1);
      spawnParticles(p.x, p.y, 10, "#0f0", 100, 0.5);
    }
  }
}

function drawPowerups() {
  for (const p of powerups) {
    ctx.save();
    ctx.translate(p.x, p.y);
    const a = 0.5 + 0.5 * Math.sin(Date.now() * 0.005);
    const colors = { weapon: "#0ff", heal: "#0f0", shield: "#ff0" };
    ctx.fillStyle = colors[p.type];
    ctx.shadowColor = colors[p.type];
    ctx.shadowBlur = 10;
    ctx.globalAlpha = 0.6 + a * 0.4;
    ctx.fillRect(-10, -10, 20, 20);
    ctx.fillStyle = "#fff";
    ctx.shadowBlur = 0;
    ctx.font = "12px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const icons = { weapon: "W", heal: "+", shield: "S" };
    ctx.fillText(icons[p.type], 0, 1);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ── COLLISIONS ───────────────────────────────────────────────

function rectCollide(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function checkCollisions() {
  // Player bullets vs enemies
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (rectCollide(b, e)) {
        playerBullets.splice(bi, 1);
        e.hp -= b.dmg;
        spawnParticles(b.x, b.y, 3, e.color, 60, 0.3);
        playSound("hit");

        if (e.hp <= 0) {
          player.combo++;
          player.comboTimer = 2;
          const mult = Math.min(player.combo, 10);
          player.score += e.score * mult;

          spawnParticles(e.x, e.y, 15, e.color, 150, 0.6);
          playSound("explode");

          // Power-up drop
          if (Math.random() < 0.15) spawnPowerup(e.x, e.y);

          if (e.isBoss) bossActive = false;
          enemies.splice(ei, 1);
        }
        break;
      }
    }
  }

  // Enemy bullets vs player
  if (player.invincible <= 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      if (Math.abs(b.x - player.x) < (b.w + player.w) / 2 &&
          Math.abs(b.y - player.y) < (b.h + player.h) / 2) {
        enemyBullets.splice(i, 1);
        damagePlayer();
      }
    }
  }
}

function damagePlayer() {
  if (player.invincible > 0) return;
  player.lives--;
  player.combo = 0;
  player.invincible = 2;
  player.weaponLevel = Math.max(0, player.weaponLevel - 1);
  spawnParticles(player.x, player.y, 12, "#f44", 120, 0.5);
  playSound("die");

  if (player.lives <= 0) {
    gameState = "gameover";
  }
}

// ── HUD ──────────────────────────────────────────────────────

function drawHUD() {
  // Score
  ctx.fillStyle = "#0ff";
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 6;
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + player.score, 10, 30);

  // Combo
  if (player.combo > 1) {
    ctx.fillStyle = "#ff0";
    ctx.shadowColor = "#ff0";
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.textAlign = "right";
    ctx.fillText("COMBO x" + Math.min(player.combo, 10), W - 10, 30);
  }

  // Lives
  ctx.fillStyle = "#f44";
  ctx.shadowColor = "#f44";
  ctx.shadowBlur = 4;
  ctx.font = "16px monospace";
  ctx.textAlign = "left";
  for (let i = 0; i < player.lives; i++) {
    ctx.fillText("♥", 10 + i * 20, 55);
  }

  // Weapon level
  ctx.fillStyle = "#0ff";
  ctx.shadowColor = "#0ff";
  ctx.font = "12px monospace";
  ctx.fillText("WPN:" + "▪".repeat(player.weaponLevel + 1), 10, 75);

  // Wave
  ctx.fillStyle = "#888";
  ctx.shadowBlur = 0;
  ctx.textAlign = "right";
  ctx.font = "12px monospace";
  ctx.fillText("WAVE " + waveNum, W - 10, 55);

  ctx.shadowBlur = 0;
}

// ── GAME STATES ──────────────────────────────────────────────

let gameState = "menu"; // menu, playing, gameover
let inputX = CX;
let keys = {};

document.addEventListener("keydown", e => { keys[e.code] = true; ensureAudio(); });
document.addEventListener("keyup", e => { keys[e.code] = false; });

canvas.addEventListener("pointerdown", e => { ensureAudio(); handleClick(e); });
canvas.addEventListener("pointermove", e => { inputX = canvasToGame(e).x; });

function canvasToGame(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * W,
    y: (e.clientY - rect.top) / rect.height * H,
  };
}

function handleClick(e) {
  const p = canvasToGame(e);
  if (gameState === "menu") {
    startGame();
  } else if (gameState === "gameover") {
    startGame();
  }
}

function startGame() {
  gameState = "playing";
  player.x = CX; player.y = H - 80;
  player.lives = 3; player.score = 0; player.combo = 0;
  player.fireCD = 0; player.invincible = 0;
  player.weaponLevel = 0; player.power = 0;
  playerBullets.length = 0;
  enemyBullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  powerups.length = 0;
  waveNum = 0; waveTimer = 1; bossActive = false;
}

function drawMenu() {
  ctx.fillStyle = "#0a0a2e";
  ctx.fillRect(0, 0, W, H);
  drawStars();

  ctx.textAlign = "center";

  // Title
  ctx.fillStyle = "#0ff";
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 20;
  ctx.font = "bold 42px 'Courier New', monospace";
  ctx.fillText("SPACE", CX, 180);
  ctx.fillText("SHOOTER", CX, 230);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#88aacc";
  ctx.font = "14px 'Courier New', monospace";
  ctx.fillText("Arrow keys / Touch to move", CX, 320);
  ctx.fillText("Auto-fire enabled", CX, 345);
  ctx.fillText("Collect W/S power-ups", CX, 370);

  ctx.fillStyle = "#ffd43b";
  ctx.font = "12px monospace";
  ctx.fillText("W = Weapon Up  |  + = Heal  |  S = Shield", CX, 410);

  const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
  ctx.globalAlpha = 0.5 + pulse * 0.5;
  ctx.fillStyle = "#0ff";
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.fillText("[ TAP TO START ]", CX, 500);
  ctx.globalAlpha = 1;

  const high = parseInt(localStorage.getItem("ss_high") || "0");
  if (high > 0) {
    ctx.fillStyle = "#ffd43b";
    ctx.font = "14px monospace";
    ctx.fillText("BEST: " + high, CX, 560);
  }
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#f44";
  ctx.shadowColor = "#f44";
  ctx.shadowBlur = 15;
  ctx.font = "bold 38px 'Courier New', monospace";
  ctx.fillText("GAME OVER", CX, 250);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff";
  ctx.font = "20px monospace";
  ctx.fillText("Score: " + player.score, CX, 310);
  ctx.fillText("Wave: " + waveNum, CX, 340);

  const high = parseInt(localStorage.getItem("ss_high") || "0");
  const isNew = player.score > high;
  if (isNew) localStorage.setItem("ss_high", String(player.score));
  if (isNew) {
    ctx.fillStyle = "#ffd43b";
    ctx.font = "bold 16px monospace";
    ctx.fillText("NEW BEST!", CX, 380);
  }

  const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
  ctx.globalAlpha = 0.5 + pulse * 0.5;
  ctx.fillStyle = "#0ff";
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.fillText("[ TAP TO RESTART ]", CX, 460);
  ctx.globalAlpha = 1;
}

// ── MAIN LOOP ────────────────────────────────────────────────

let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  ctx.clearRect(0, 0, W, H);

  if (gameState === "menu") {
    updateStars(dt);
    drawMenu();
  } else if (gameState === "playing") {
    // Input
    if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed * dt;
    if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed * dt;
    // Touch: move toward inputX
    const dx = inputX - player.x;
    if (Math.abs(dx) > 5) player.x += Math.sign(dx) * Math.min(Math.abs(dx), player.speed * dt);
    player.x = Math.max(20, Math.min(W - 20, player.x));

    // Auto-fire
    player.fireCD -= dt * 1000;
    if (player.fireCD <= 0) {
      player.fireCD = player.fireRate;
      shootPlayer();
    }

    // Timers
    if (player.invincible > 0) player.invincible -= dt;
    if (player.power > 0) player.power -= dt;
    if (player.comboTimer > 0) {
      player.comboTimer -= dt;
      if (player.comboTimer <= 0) player.combo = 0;
    }

    // Update
    updateStars(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updatePowerups(dt);
    checkCollisions();
    updateParticles(dt);

    // Draw
    drawStars();
    drawBullets();
    drawEnemies();
    drawPowerups();
    drawPlayer();
    drawParticles();
    drawHUD();
  } else if (gameState === "gameover") {
    updateParticles(dt);
    drawStars();
    drawBullets();
    drawEnemies();
    drawParticles();
    drawPlayer();
    drawGameOver();
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
