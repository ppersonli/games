<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}
body{display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace}
canvas{display:block;touch-action:none}
.loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0f0;font-size:18px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="loader">LOADING...</div>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// SNAKE GAME — Pure HTML5 Canvas
// Keyboard + Touch controls | Responsive | Scoring
// ═══════════════════════════════════════════════════════════════

document.querySelector(".loader").style.display = "none";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const GRID = 20;
const COLS = 24, ROWS = 24;
const W = COLS * GRID, H = ROWS * GRID;

function resize() {
  const ratio = W / H;
  let w = window.innerWidth, h = window.innerHeight;
  if (w / h > ratio) w = h * ratio; else h = w / ratio;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener("resize", resize);

// ── AUDIO ────────────────────────────────────────────────────

let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playTone(freq, dur, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function sndEat() { playTone(600, 0.1, 0.08); setTimeout(() => playTone(900, 0.1, 0.06), 60); }
function sndDie() { playTone(200, 0.3, 0.1); setTimeout(() => playTone(100, 0.4, 0.08), 100); }

// ── STATE ────────────────────────────────────────────────────

let snake, dir, nextDir, food, score, highScore, speed, alive, gameState;
let moveTimer, moveInterval;
let particles = [];
highScore = parseInt(localStorage.getItem("snake_high") || "0");

function init() {
  const mid = Math.floor(ROWS / 2);
  snake = [{ x: 5, y: mid }, { x: 4, y: mid }, { x: 3, y: mid }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speed = 8; // moves per second
  alive = true;
  moveTimer = 0;
  particles = [];
  spawnFood();
}

function spawnFood() {
  let tries = 0;
  while (tries < 500) {
    const x = Math.floor(Math.random() * COLS);
    const y = Math.floor(Math.random() * ROWS);
    if (!snake.some(s => s.x === x && s.y === y)) {
      food = { x, y, type: Math.random() < 0.1 ? "bonus" : "normal" };
      return;
    }
    tries++;
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x * GRID + GRID / 2, y: y * GRID + GRID / 2,
      vx: (Math.random() - 0.5) * 150,
      vy: (Math.random() - 0.5) * 150,
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.5,
      size: 2 + Math.random() * 3,
      color,
    });
  }
}

// ── INPUT ────────────────────────────────────────────────────

document.addEventListener("keydown", e => {
  ensureAudio();
  if (gameState === "menu") { gameState = "playing"; init(); return; }
  if (gameState === "gameover") { gameState = "playing"; init(); return; }

  switch (e.code) {
    case "ArrowUp":    case "KeyW": if (dir.y !== 1) nextDir = { x: 0, y: -1 }; break;
    case "ArrowDown":  case "KeyS": if (dir.y !== -1) nextDir = { x: 0, y: 1 }; break;
    case "ArrowLeft":  case "KeyA": if (dir.x !== 1) nextDir = { x: -1, y: 0 }; break;
    case "ArrowRight": case "KeyD": if (dir.x !== -1) nextDir = { x: 1, y: 0 }; break;
  }
  e.preventDefault();
});

// Touch swipe
let touchStart = null;
canvas.addEventListener("pointerdown", e => {
  ensureAudio();
  if (gameState === "menu") { gameState = "playing"; init(); return; }
  if (gameState === "gameover") { gameState = "playing"; init(); return; }
  touchStart = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointerup", e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x;
  const dy = e.clientY - touchStart.y;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 15) return;
  if (absDx > absDy) {
    if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
    else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
  } else {
    if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
    else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
  }
  touchStart = null;
});

// ── UPDATE ───────────────────────────────────────────────────

function update(dt) {
  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (!alive) return;

  moveTimer += dt;
  moveInterval = 1 / speed;
  if (moveTimer < moveInterval) return;
  moveTimer -= moveInterval;

  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    alive = false; sndDie(); spawnParticles(snake[0].x, snake[0].y, "#f44", 15);
    setTimeout(() => { if (score > highScore) { highScore = score; localStorage.setItem("snake_high", String(highScore)); } gameState = "gameover"; }, 600);
    return;
  }

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false; sndDie(); spawnParticles(head.x, head.y, "#f44", 15);
    setTimeout(() => { if (score > highScore) { highScore = score; localStorage.setItem("snake_high", String(highScore)); } gameState = "gameover"; }, 600);
    return;
  }

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    const pts = food.type === "bonus" ? 5 : 1;
    score += pts;
    speed = Math.min(20, 8 + Math.floor(score / 5));
    sndEat();
    spawnParticles(food.x, food.y, food.type === "bonus" ? "#ffd43b" : "#0f0", 10);
    spawnFood();
  } else {
    snake.pop();
  }
}

// ── DRAW ─────────────────────────────────────────────────────

function drawGrid() {
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x * GRID, 0); ctx.lineTo(x * GRID, H); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * GRID); ctx.lineTo(W, y * GRID); ctx.stroke(); }
}

function drawSnake() {
  for (let i = 0; i < snake.length; i++) {
    const s = snake[i];
    const t = i / snake.length;
    const r = Math.round(0 + t * 0);
    const g = Math.round(220 - t * 100);
    const b = Math.round(80 - t * 40);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    if (i === 0) {
      ctx.shadowColor = "#0f0";
      ctx.shadowBlur = 8;
      ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
      ctx.shadowBlur = 0;
      // Eyes
      ctx.fillStyle = "#fff";
      const ex = s.x * GRID + (dir.x === 1 ? 12 : dir.x === -1 ? 4 : 6);
      const ey = s.y * GRID + (dir.y === 1 ? 12 : dir.y === -1 ? 4 : 6);
      ctx.fillRect(ex, ey, 3, 3);
      ctx.fillRect(ex + (dir.x !== 0 ? 0 : 5), ey + (dir.y !== 0 ? 0 : 5), 3, 3);
    } else {
      ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
    }
  }
}

function drawFood() {
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.005);
  const gx = food.x * GRID, gy = food.y * GRID;
  if (food.type === "bonus") {
    ctx.fillStyle = "#ffd43b";
    ctx.shadowColor = "#ffd43b";
  } else {
    ctx.fillStyle = "#f44";
    ctx.shadowColor = "#f44";
  }
  ctx.shadowBlur = 10 * pulse;
  ctx.beginPath();
  ctx.arc(gx + GRID / 2, gy + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (food.type === "bonus") {
    ctx.fillStyle = "#000";
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("5", gx + GRID / 2, gy + GRID / 2 + 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = "#0f0";
  ctx.shadowColor = "#0f0";
  ctx.shadowBlur = 4;
  ctx.font = "bold 16px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE: " + score, 8, 20);
  ctx.fillStyle = "#888";
  ctx.shadowBlur = 0;
  ctx.font = "12px monospace";
  ctx.fillText("BEST: " + highScore, 8, 36);
  ctx.textAlign = "right";
  ctx.fillText("SPEED: " + speed, W - 8, 20);
}

function drawMenu() {
  drawGrid();
  ctx.textAlign = "center";
  ctx.fillStyle = "#0f0";
  ctx.shadowColor = "#0f0";
  ctx.shadowBlur = 15;
  ctx.font = "bold 40px 'Courier New', monospace";
  ctx.fillText("SNAKE", CX, H / 2 - 60);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#888";
  ctx.font = "14px monospace";
  ctx.fillText("Arrow keys / Swipe to move", CX, H / 2);
  ctx.fillText("Red = 1pt  |  Gold = 5pt", CX, H / 2 + 25);
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
  ctx.globalAlpha = 0.4 + pulse * 0.6;
  ctx.fillStyle = "#0f0";
  ctx.font = "bold 18px monospace";
  ctx.fillText("[ TAP OR PRESS ANY KEY ]", CX, H / 2 + 80);
  ctx.globalAlpha = 1;
  if (highScore > 0) {
    ctx.fillStyle = "#ffd43b";
    ctx.font = "14px monospace";
    ctx.fillText("BEST: " + highScore, CX, H / 2 + 120);
  }
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#f44";
  ctx.shadowColor = "#f44";
  ctx.shadowBlur = 12;
  ctx.font = "bold 36px 'Courier New', monospace";
  ctx.fillText("GAME OVER", CX, H / 2 - 50);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff";
  ctx.font = "20px monospace";
  ctx.fillText("Score: " + score, CX, H / 2);
  ctx.fillText("Length: " + snake.length, CX, H / 2 + 30);
  if (score >= highScore && score > 0) {
    ctx.fillStyle = "#ffd43b";
    ctx.font = "bold 16px monospace";
    ctx.fillText("NEW BEST!", CX, H / 2 + 65);
  }
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
  ctx.globalAlpha = 0.4 + pulse * 0.6;
  ctx.fillStyle = "#0f0";
  ctx.font = "bold 16px monospace";
  ctx.fillText("[ TAP TO RESTART ]", CX, H / 2 + 110);
  ctx.globalAlpha = 1;
}

// ── MAIN LOOP ────────────────────────────────────────────────

const CX = W / 2;
gameState = "menu";
let lastTime = 0;

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  if (gameState === "menu") {
    drawMenu();
  } else if (gameState === "playing") {
    update(dt);
    drawGrid();
    drawFood();
    drawSnake();
    drawParticles();
    drawHUD();
  } else if (gameState === "gameover") {
    drawGrid();
    drawFood();
    drawSnake();
    drawParticles();
    drawGameOver();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
